name: deploy fake-ai-api to cloudflare workers

# 独立于博客的部署流水线：只碰 fake-ai-api/ 这个目录，部署成单独的 Worker。
# 复用仓库已有的 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，不需要新 secret，
# 也不需要本地 wrangler login。

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - "fake-ai-api/**"
      - ".github/workflows/deploy-fake-ai.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy fake-ai-api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: fake-ai-api
        run: npm ci --no-audit --no-fund

      # 部署到 ai.700214.xyz（custom_domain，见 fake-ai-api/wrangler.toml）。
      # 首次部署会顺带创建 DNS 记录并签发证书；后续部署只更新 Worker 代码。
      #
      # --config 是必须的：wrangler 会向上层目录找配置，在仓库根存在
      # wrangler.jsonc（博客生成的）时，它会加载那个而不是本目录的
      # wrangler.toml，结果把整蛊 Worker 覆盖成博客。显式指定避免踩这个坑。
      - name: Deploy to Cloudflare Workers
        working-directory: fake-ai-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml

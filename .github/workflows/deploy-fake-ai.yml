name: deploy fake-ai-api to cloudflare workers

# 独立于博客的部署流水线：只碰 fake-ai-api/ 这个目录，部署成单独的 Worker。
# 复用仓库已有的 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，不需要新 secret，
# 也不需要本地 wrangler login。

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - "fake-ai-api/**"
      - ".github/workflows/deploy-fake-ai.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy fake-ai-api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: fake-ai-api
        run: npm ci --no-audit --no-fund

      # 不带 routes 部署 → 只会得到 fake-ai-api.<账号子域>.workers.dev，
      # 不会碰到博客的自定义域名。
      - name: Deploy to Cloudflare Workers
        working-directory: fake-ai-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

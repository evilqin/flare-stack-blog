name: deploy to cloudflare workers

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".agent/**"
      - ".vscode/**"
      - ".gitignore"
      # fake-ai-api 有独立的部署流水线（deploy-fake-ai.yml），
      # 只改玩具时不应触发整个博客重建 + CDN purge。
      - "fake-ai-api/**"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun ci

      # === Original repo: fetch secrets from Vault ===
      - name: "[Vault] Import cloudflare secrets"
        if: github.repository == 'du2333/flare-stack-blog'
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.dukda.com
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            secrets/data/cloudflare *

      - name: "[Vault] Import runtime secrets"
        if: github.repository == 'du2333/flare-stack-blog'
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.dukda.com
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            secrets/data/blog *

      # === Fork repos: use repository secrets ===
      #
      # Build-time variables (WORKER_NAME, QUEUE_NAME, ...) are read by
      # `bun run wrangler:prepare`. WORKER_NAME and QUEUE_NAME must match the
      # EXISTING Worker and queue in Cloudflare — a wrong value silently creates
      # a second Worker and binds the custom domain to it.
      - name: "[Fork] Import secrets from repository"
        if: github.repository != 'du2333/flare-stack-blog'
        run: |
          echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" >> $GITHUB_ENV
          echo "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" >> $GITHUB_ENV
          echo "WORKER_NAME=${{ secrets.WORKER_NAME }}" >> $GITHUB_ENV
          echo "QUEUE_NAME=${{ secrets.QUEUE_NAME }}" >> $GITHUB_ENV
          echo "D1_DATABASE_ID=${{ secrets.D1_DATABASE_ID }}" >> $GITHUB_ENV
          echo "KV_NAMESPACE_ID=${{ secrets.KV_NAMESPACE_ID }}" >> $GITHUB_ENV
          echo "BUCKET_NAME=${{ secrets.BUCKET_NAME }}" >> $GITHUB_ENV
          echo "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}" >> $GITHUB_ENV
          echo "BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }}" >> $GITHUB_ENV
          echo "GITHUB_CLIENT_ID=${{ secrets.GH_CLIENT_ID }}" >> $GITHUB_ENV
          echo "GITHUB_CLIENT_SECRET=${{ secrets.GH_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "GITHUB_TOKEN=${{ secrets.GH_TOKEN }}" >> $GITHUB_ENV
          echo "DOMAIN=${{ secrets.DOMAIN }}" >> $GITHUB_ENV
          echo "UMAMI_SRC=${{ secrets.UMAMI_SRC }}" >> $GITHUB_ENV
          echo "UMAMI_WEBSITE_ID=${{ secrets.UMAMI_WEBSITE_ID }}" >> $GITHUB_ENV
          echo "UMAMI_API_KEY=${{ secrets.UMAMI_API_KEY }}" >> $GITHUB_ENV
          echo "VITE_UMAMI_WEBSITE_ID=${{ vars.VITE_UMAMI_WEBSITE_ID }}" >> $GITHUB_ENV
          echo "VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}" >> $GITHUB_ENV
          echo "TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}" >> $GITHUB_ENV
          # Kept only to purge the stale CDN cache left over from v1, which served
          # HTML with s-maxage=1y. Drop these two secrets once the cache is clear.
          echo "CLOUDFLARE_ZONE_ID=${{ secrets.CLOUDFLARE_ZONE_ID }}" >> $GITHUB_ENV
          echo "CLOUDFLARE_PURGE_API_TOKEN=${{ secrets.CLOUDFLARE_PURGE_API_TOKEN }}" >> $GITHUB_ENV

      # cloudflare.config.ts reads ROUTE / ZONE_NAME while `cf build` runs, so
      # they must go through $GITHUB_ENV — a plain `export` does not survive the
      # step. Leaving ROUTE unset selects the custom-domain trigger, which is
      # what this fork deploys; set the ROUTE repo variable to use a route.
      - name: Inject Resource IDs
        run: |
          echo "ROUTE=${ROUTE:-${{ vars.ROUTE }}}" >> "$GITHUB_ENV"
          echo "ZONE_NAME=${ZONE_NAME:-${{ vars.ZONE_NAME }}}" >> "$GITHUB_ENV"

      # `cf workers secrets bulk` takes a JSON Merge Patch keyed by secret name,
      # each value a SecretText object — not the flat {"KEY": "value"} shape
      # that `wrangler secret bulk` accepted. Empty values are still included so
      # the payload matches what the wrangler-based step sent before.
      - name: Generate Secrets JSON
        run: |
          bun -e '
          const keys = [
            "BETTER_AUTH_SECRET", "BETTER_AUTH_URL", "GITHUB_CLIENT_ID",
            "GITHUB_CLIENT_SECRET", "DOMAIN", "UMAMI_SRC", "UMAMI_WEBSITE_ID",
            "UMAMI_API_KEY", "VITE_UMAMI_WEBSITE_ID", "TURNSTILE_SECRET_KEY",
            "GITHUB_TOKEN",
          ];
          const out = {};
          for (const key of keys) {
            out[key] = { name: key, text: process.env[key] ?? "", type: "secret_text" };
          }
          console.log(JSON.stringify(out, null, 2));
          ' > secrets.json

      # NOTE: the pre-migration `wrangler d1 export` backup was removed on
      # 2026-10-02. Migration 0019 added an FTS5 virtual table
      # (`search_documents_fts`), and D1's export API rejects any database
      # containing one server-side — before table filtering, and regardless of
      # --no-schema/--no-data — so the step failed unconditionally and blocked
      # every deploy since 2026-09-16. cloudflare/workers-sdk#6305.
      #
      # There is currently NO backup step. Before running another destructive
      # migration (0013/0014/0021 rewrote comment bodies in place, dropped
      # page_views and friend_links.contact_email), restore a safety net first:
      # either record a D1 Time Travel bookmark here
      # (`bunx cf d1 time-travel get-bookmark "$D1_DATABASE_ID"`) or drop
      # `search_documents_fts` + its triggers, export, then recreate them.
      - name: Deploy to Cloudflare Workers
        run: |
          bunx cf workers secrets bulk --worker "$WORKER_NAME" --file secrets.json
          bun run build
          bun run deploy

      # v1 served HTML with `s-maxage=31536000`. Those edge entries outlive the
      # deploy unless they are purged, so this step is what actually makes the
      # new site visible. Purge by host (not by URL prefix) to cover everything.
      - name: Purge Cloudflare CDN Cache
        run: |
          HOSTS=$(printf '%s\n' "${CDN_DOMAIN:-$DOMAIN}" "$DOMAIN" | sort -u | grep -v '^$' \
            | sed 's/.*/"&"/' | paste -sd, -)
          echo "Purging CDN cache for hosts: $HOSTS"
          curl -sS --fail-with-body -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_PURGE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"hosts\":[$HOSTS]}"
          echo ""

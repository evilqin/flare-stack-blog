name: Sync Upstream

on:
  schedule:
    # Run weekly on Monday at 03:00 UTC
    - cron: '3 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync with upstream
    runs-on: ubuntu-latest
    steps:
      # Fail loudly rather than silently falling back to GITHUB_TOKEN.
      - name: Check SYNC_TOKEN is configured
        run: |
          if [ -z "${{ secrets.SYNC_TOKEN }}" ]; then
            echo "::error::SYNC_TOKEN is not set. The default GITHUB_TOKEN cannot push commits that touch .github/workflows/**, so the sync would fail with 'refusing to allow a GitHub App to create or update workflow'. Add a fine-grained PAT (Contents, Workflows, Pull requests: read and write) as the SYNC_TOKEN repository secret."
            exit 1
          fi

      # The default GITHUB_TOKEN is rejected when a push touches
      # .github/workflows/**, which is why every sync that carried an upstream
      # workflow change failed silently: the conflict branch was never pushed
      # and no PR was ever opened. SYNC_TOKEN is a fine-grained PAT scoped to
      # this repository only.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "evilqin"
          git config user.email "evilqin@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/du2333/flare-stack-blog.git
          git fetch upstream

      - name: Check for upstream changes
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "Commits behind upstream: $BEHIND"
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"

      - name: Try merge
        id: merge
        if: steps.check.outputs.behind > 0
        run: |
          echo "=== Attempting merge ==="
          git merge upstream/main --no-commit 2>&1 || true
          if git ls-files -u | grep -q .; then
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            echo "conflicted_files<<EOF" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "Merge has conflicts - will open a PR for manual resolution."
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "Merge is clean."
          fi

      # Clean merge (no conflicts) -> push directly to main
      - name: Push clean merge
        if: steps.merge.outputs.status == 'success'
        run: |
          git commit -m "chore: merge upstream changes"
          git push origin main
          echo "Clean merge pushed to main."

      # Conflicted merge -> open a PR for manual resolution.
      # IMPORTANT: never auto-resolve with '--theirs' here - that silently
      # drops local customizations (e.g. getAdjacentPosts was lost this way).
      - name: Open PR for conflict resolution
        if: steps.merge.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          CONFLICTED=$(git diff --name-only --diff-filter=U)
          git merge --abort

          # (Re)build the PR branch from current main so it is always fresh
          git switch merge-upstream/auto 2>/dev/null || git switch -c merge-upstream/auto
          git reset --hard main
          git merge upstream/main --no-commit 2>&1 || true

          # Commit the conflicted state so the PR shows it for resolution
          git add -A
          git commit -m "chore: merge upstream changes (conflicts need resolution)" || true
          git push -u origin merge-upstream/auto

          PR_BODY=$(cat <<EOF
          Upstream (du2333/flare-stack-blog) has new changes that conflict with local customizations.

          :warning: Do NOT merge until the conflicts are resolved. No local code was overwritten - the conflicts were committed to this branch for you to resolve.

          Conflicted files:
          $CONFLICTED

          How to resolve:
          1. Open each conflicted file (look for '<<<<<<<', '=======', '>>>>>>>' markers).
          2. Keep the local custom logic AND the upstream fix where both matter.
          3. Use Claude Code: git fetch upstream && git checkout merge-upstream/auto && git merge upstream/main, then ask Claude to resolve the conflicts.
          4. Commit and push - this PR updates automatically. Then merge.
          EOF
          )

          gh pr create --base main --head merge-upstream/auto \
            --title "chore: merge upstream changes (conflicts need resolution)" \
            --label automated \
            --body "$PR_BODY" \
            || gh pr edit merge-upstream/auto --body "$PR_BODY" \
            || echo "Could not create/edit PR - branch was pushed, please open one manually."

      - name: No updates
        if: steps.check.outputs.behind == 0
        run: echo "Repository is up to date with upstream. No changes needed."
